<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Psychedelic background: deep purple base + concentric trippy rings -->
  <rect width="512" height="512" fill="#170833"/>
  <circle cx="256" cy="256" r="252" fill="#31095E"/>
  <circle cx="256" cy="256" r="226" fill="#4C0D8F"/>
  <circle cx="256" cy="256" r="200" fill="#7209B7"/>
  <circle cx="256" cy="256" r="176" fill="#C026D3"/>
  <circle cx="256" cy="256" r="154" fill="#E879F9"/>

  <!-- Thin rainbow halo rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#22D3EE" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#FBBF24" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#FB7185" stroke-width="5" opacity="0.85"/>

  <!-- Sparkles in the corners -->
  <path d="M64 84 L70 100 L86 106 L70 112 L64 128 L58 112 L42 106 L58 100 Z" fill="#22D3EE"/>
  <path d="M452 132 L457 145 L470 150 L457 155 L452 168 L447 155 L434 150 L447 145 Z" fill="#FBBF24"/>
  <path d="M96 404 L101 417 L114 422 L101 427 L96 440 L91 427 L78 422 L91 417 Z" fill="#FB7185"/>
  <path d="M440 396 L445 409 L458 414 L445 419 L440 432 L435 419 L422 414 L435 409 Z" fill="#A7F3D0"/>

  <!-- Psyduck -->
  <!-- Signature head hairs (behind head) -->
  <path d="M238 128 C 230 92, 240 64, 258 50" stroke="#FFD93B" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M266 122 C 262 88, 276 66, 292 58" stroke="#FFD93B" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Feet (peek out under the body) -->
  <ellipse cx="205" cy="418" rx="34" ry="14" fill="#F59E0B"/>
  <ellipse cx="307" cy="418" rx="34" ry="14" fill="#F59E0B"/>

  <!-- Arms -->
  <ellipse cx="112" cy="300" rx="16" ry="34" fill="#FFD93B" transform="rotate(20 112 300)"/>
  <ellipse cx="400" cy="300" rx="16" ry="34" fill="#FFD93B" transform="rotate(-20 400 300)"/>

  <!-- Head / body blob -->
  <circle cx="256" cy="260" r="150" fill="#FFD93B"/>

  <!-- Belly -->
  <ellipse cx="256" cy="360" rx="82" ry="46" fill="#FFF3C4"/>

  <!-- Beak -->
  <rect x="198" y="282" width="116" height="44" rx="22" fill="#FFB020"/>
  <path d="M214 304 Q 256 314 298 304" stroke="#D97706" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Worried brows -->
  <path d="M178 202 Q 202 188 228 196" stroke="#B45309" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M284 196 Q 310 188 334 202" stroke="#B45309" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Psychedelic swirl eyes -->
  <g>
    <circle cx="204" cy="225" r="18" fill="#1F2937"/>
    <circle cx="204" cy="225" r="13" fill="#A21CAF"/>
    <circle cx="204" cy="225" r="8.5" fill="#EC4899"/>
    <circle cx="204" cy="225" r="5" fill="#22D3EE"/>
    <circle cx="204" cy="225" r="2.8" fill="#0F172A"/>
    <circle cx="199" cy="219" r="3" fill="#FFFFFF"/>
  </g>
  <g>
    <circle cx="308" cy="225" r="18" fill="#1F2937"/>
    <circle cx="308" cy="225" r="13" fill="#A21CAF"/>
    <circle cx="308" cy="225" r="8.5" fill="#EC4899"/>
    <circle cx="308" cy="225" r="5" fill="#22D3EE"/>
    <circle cx="308" cy="225" r="2.8" fill="#0F172A"/>
    <circle cx="303" cy="219" r="3" fill="#FFFFFF"/>
  </g>
</svg>
